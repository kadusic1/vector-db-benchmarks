[project]
name = "database-optimization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "faiss-cpu>=1.14.2",

    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "qdrant-client>=1.18.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
generate = [
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.16",
]

[tool.mypy]
ignore_missing_imports = true
